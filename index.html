<style>
  /* Telegram passes its theme as --tg-theme-*; outside Telegram the system light / dark defaults apply. */
  :root {
    --fb-bg: #f2f2f7; --fb-card: #ffffff; --fb-text: #000000; --fb-hint: #8e8e93; --fb-accent: #007aff;
    --fb-sep: rgb(60 60 67 / .2);
  }
  @media (prefers-color-scheme: dark) {
    :root { --fb-bg: #000000; --fb-card: #1c1c1e; --fb-text: #ffffff; --fb-hint: #8e8e93; --fb-accent: #0a84ff; --fb-sep: rgb(84 84 88 / .6); }
  }
  :root {
    --bg: var(--tg-theme-secondary-bg-color, var(--fb-bg));
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, var(--fb-card)));
    --text: var(--tg-theme-text-color, var(--fb-text));
    --hint: var(--tg-theme-hint-color, var(--fb-hint));
    --head: var(--tg-theme-section-header-text-color, var(--hint));
    --accent: var(--tg-theme-button-color, var(--fb-accent));
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --link: var(--tg-theme-link-color, var(--accent));
    --danger: var(--tg-theme-destructive-text-color, #ff3b30);
    --sep: var(--tg-theme-section-separator-color, var(--fb-sep));
    --fill: color-mix(in srgb, var(--text) 8%, transparent);
    --r: 12px;
  }
  /* WebViews without color-mix() (Android before Chrome 111, older Linux Telegram Desktop): plain greys, else the controls vanish */
  @supports not (color: color-mix(in srgb, red, blue)) {
    :root { --fill: rgb(120 120 128 / .16); }
    .tick { border-color: rgb(120 120 128 / .6); }
    .alert.error { background: rgb(255 59 48 / .12); }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; }
  main { max-width: 600px; margin: 0 auto; padding: 12px 16px 96px; display: grid; gap: 22px; }
  [hidden] { display: none !important; }
  svg { flex: none; }

  /* top */
  .top { display: flex; align-items: center; gap: 10px; padding: 2px 4px 0; }
  .avatar { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--accent);
    color: var(--accent-text); font-weight: 700; font-size: 15px; }
  .top h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .top .who { color: var(--hint); font-size: 13px; }

  /* type launcher: app icons */
  .launcher { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--card); border-radius: var(--r); padding: 12px 6px; }
  .app { display: grid; justify-items: center; gap: 6px; padding: 8px 2px; border-radius: 10px; text-align: center; animation: rise .3s ease both; }
  .app:active { background: var(--fill); }
  .app .t { font-size: 12.5px; line-height: 1.2; font-weight: 500; }
  .sq { width: 48px; height: 48px; border-radius: 13px; display: grid; place-items: center; font-size: 25px; background: var(--g);
    box-shadow: inset 0 0 0 .5px rgb(255 255 255 / .2), 0 2px 6px rgb(0 0 0 / .12); }
  .sq.sm { width: 30px; height: 30px; border-radius: 8px; font-size: 16px; box-shadow: none; }

  /* grouped lists */
  .group { display: grid; gap: 6px; }
  .group-h { padding: 0 16px; color: var(--head); font-size: 13px; text-transform: uppercase; letter-spacing: .02em; }
  .group-f { padding: 0 16px; color: var(--hint); font-size: 13px; }
  .card { background: var(--card); border-radius: var(--r); overflow: hidden; }
  .cell { position: relative; display: block; width: 100%; text-align: left; }
  .cell + .cell::before, .line + .line::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px;
    background: var(--sep); transform: scaleY(.5); transform-origin: top; }
  .row { display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 8px 16px; }
  .row > .grow { flex: 1; min-width: 0; }
  .lb { display: flex; align-items: center; gap: 8px; }
  .lb .ic { width: 22px; text-align: center; font-size: 16px; }
  .val { margin-left: auto; color: var(--hint); max-width: 58%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .val.on { color: var(--text); }
  .chev { color: var(--hint); opacity: .6; }
  button.cell:active, .tap:active { background: var(--fill); }
  .invalid .lb { color: var(--danger); }

  /* stacked: a small caption over the input */
  .stack { padding: 8px 16px 9px; display: grid; gap: 2px; }
  .cap { display: flex; align-items: center; gap: 6px; color: var(--hint); font-size: 12.5px; font-weight: 500; }
  .invalid .cap { color: var(--danger); }
  .stack input, .stack textarea, .line input { width: 100%; border: 0; outline: 0; background: transparent; padding: 2px 0; font-size: 16px; }
  .stack textarea { resize: none; min-height: 24px; line-height: 1.35; overflow: hidden; }
  input::placeholder, textarea::placeholder { color: color-mix(in srgb, var(--hint) 75%, transparent); }
  .inline-input { margin-left: auto; border: 0; outline: 0; background: var(--fill); border-radius: 8px; padding: 6px 10px; font-size: 16px;
    color: var(--text); min-width: 0; }

  /* segmented control, chips, switch, checkbox */
  .seg { display: inline-flex; margin-left: auto; padding: 2px; border-radius: 9px; background: var(--fill); }
  .seg button { padding: 5px 12px; border-radius: 7px; font-size: 14px; font-weight: 600; color: var(--text); transition: background .15s ease; }
  .seg button[aria-pressed="true"] { background: var(--card); box-shadow: 0 1px 3px rgb(0 0 0 / .14), 0 0 0 .5px rgb(0 0 0 / .04); }
  .chips { display: inline-flex; gap: 6px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
  .chip { padding: 6px 12px; border-radius: 999px; background: var(--fill); font-size: 14px; font-weight: 600; transition: background .15s ease; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
  .switch { position: relative; flex: none; width: 51px; height: 31px; border-radius: 999px; background: var(--fill); transition: background .2s ease; margin-left: auto; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #ffffff;
    box-shadow: 0 2px 4px rgb(0 0 0 / .2); transition: transform .2s ease; }
  .switch[aria-checked="true"] { background: var(--accent); }
  .switch[aria-checked="true"]::after { transform: translateX(20px); }
  .tick { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid color-mix(in srgb, var(--hint) 70%, transparent);
    display: grid; place-items: center; color: transparent; transition: background .15s ease, border-color .15s ease; }
  [aria-checked="true"] > .tick { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }

  /* nested lines: links, env rows, files */
  .lines { padding-left: 0; }
  .line { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 6px 16px; text-align: left; }
  .add > span { white-space: nowrap; }
  .line.kv input { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 15px; }
  .line .eq { color: var(--hint); }
  .x { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--fill); color: var(--hint); font-size: 12px; }
  .add { color: var(--link); font-weight: 500; }
  .add .plus { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-text);
    font-size: 17px; line-height: 1; }
  .file .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file .sz { color: var(--hint); font-size: 13px; }
  .file .fi { width: 22px; text-align: center; }
  .add .s { min-width: 0; color: var(--hint); font-size: 13px; margin-left: auto; overflow: hidden; text-overflow: ellipsis; }

  /* the type row */
  .type-row .tt { font-weight: 600; }
  .type-row .ts { color: var(--hint); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .change { color: var(--link); font-size: 15px; display: flex; align-items: center; gap: 2px; }

  /* banners */
  .alert { border-radius: var(--r); padding: 12px 14px; background: var(--card); font-size: 15px; display: flex; gap: 10px; }
  .alert.error { background: color-mix(in srgb, var(--danger) 12%, var(--card)); color: var(--danger); font-weight: 500; }
  .alert .hint { color: var(--hint); font-size: 13px; }

  /* bottom sheet */
  .back { position: fixed; inset: 0; background: rgb(0 0 0 / .35); opacity: 0; transition: opacity .2s ease; z-index: 20; }
  .back.on { opacity: 1; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 600px; margin: 0 auto; max-height: 82vh; display: flex; flex-direction: column;
    background: var(--bg); border-radius: 14px 14px 0 0; transform: translateY(100%); transition: transform .25s cubic-bezier(.2, .8, .2, 1);
    padding-bottom: env(safe-area-inset-bottom); }
  .sheet.on { transform: none; }
  .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--fill); margin: 7px auto 2px; }
  .sheet-h { display: flex; align-items: center; padding: 6px 16px 10px; }
  .sheet-h b { flex: 1; text-align: center; font-size: 17px; font-weight: 600; margin-left: 52px; }
  .sheet-h button { color: var(--link); font-weight: 600; width: 52px; text-align: right; }
  .search { margin: 0 16px 10px; display: flex; align-items: center; gap: 6px; background: var(--fill); border-radius: 10px; padding: 7px 10px; color: var(--hint); }
  .search input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 16px; color: var(--text); }
  .sheet-list { overflow-y: auto; margin: 0 16px 16px; background: var(--card); border-radius: var(--r); }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 46px; padding: 8px 16px; text-align: left; position: relative; }
  .opt + .opt::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--sep); transform: scaleY(.5); }
  .opt:active { background: var(--fill); }
  .opt .ol { flex: 1; min-width: 0; display: grid; }
  .opt .os { color: var(--hint); font-size: 13px; }
  .opt.custom { color: var(--link); font-weight: 500; }
  .opt.muted { color: var(--danger); }
  .opt .ok { color: var(--accent); }
  .empty { padding: 16px; color: var(--hint); text-align: center; font-size: 15px; }

  /* done */
  .done { display: grid; justify-items: center; gap: 10px; padding: 36px 8px 8px; text-align: center; }
  .done .badge { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-text);
    animation: pop .45s cubic-bezier(.2, 1.4, .4, 1) both; }
  .done h2 { margin: 6px 0 0; font-size: 22px; font-weight: 700; }
  .done p { margin: 0; color: var(--hint); font-size: 15px; max-width: 360px; }
  .btn { width: 100%; border-radius: var(--r); padding: 14px; font-weight: 600; font-size: 17px; background: var(--accent); color: var(--accent-text); }
  .btn.plain { background: var(--card); color: var(--link); }
  .actions { width: 100%; display: grid; gap: 8px; margin-top: 12px; }
  #fallbackSend { position: fixed; left: 16px; right: 16px; bottom: calc(12px + env(safe-area-inset-bottom)); width: auto; max-width: 568px; margin: 0 auto; z-index: 10;
    box-shadow: 0 6px 20px rgb(0 0 0 / .18); }

  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main id="app">
  <div class="top">
    <div class="avatar" id="avatar" aria-hidden="true">✓</div>
    <div>
      <h1 id="title">Новая заявка</h1>
      <div class="who" id="who">Загрузка…</div>
    </div>
  </div>
  <div class="alert error" id="error" role="alert" hidden></div>
  <div class="alert" id="fix" hidden></div>
  <section class="group" id="picker" hidden>
    <div class="group-h">Что нужно от DevOps / SRE</div>
    <div class="launcher" id="types"></div>
  </section>
  <div id="form" hidden></div>
  <section id="done" class="done" hidden></section>
</main>
<div class="back" id="sheetBack" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="grab"></div>
  <div class="sheet-h"><b id="sheetTitle"></b><button type="button" id="sheetDone">Готово</button></div>
  <label class="search" id="sheetSearchBox">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" id="sheetSearch" placeholder="Поиск или своё значение" autocomplete="off" aria-label="Поиск">
  </label>
  <div class="sheet-list" id="sheetList"></div>
</div>
<button class="btn" id="fallbackSend" type="button" hidden>Отправить заявку</button>
<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const initData = tg ? tg.initData : "";
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  const el = (tag, cls, html) => {
    const e = document.createElement(tag);
    if (cls) {
      e.className = cls;
    }
    if (html != null) {
      e.innerHTML = html;
    }
    return e;
  };
  const CHEVRON = "<svg class='chev' width='8' height='14' viewBox='0 0 8 14' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='m1 1 6 6-6 6'/></svg>";
  const CHECK = "<svg width='13' height='13' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='M5 12.5 10 17.5 19 7'/></svg>";
  const CATEGORY = {db: "DB", env: "ENV", files: "OTHER"};
  // the request types by colour, like app icons
  const GRADIENT = {
    DEPLOY: "linear-gradient(160deg, #7c7ff7, #5b4fe0)", HOTFIX: "linear-gradient(160deg, #ff9f43, #ff3b30)",
    ROLLBACK: "linear-gradient(160deg, #8e9aaf, #5a6478)", INFRA: "linear-gradient(160deg, #34d1bf, #0f9d76)",
    ACCESS: "linear-gradient(160deg, #ffd23f, #f59f00)", INCIDENT: "linear-gradient(160deg, #ff6b8b, #e0245e)",
    MOBILE: "linear-gradient(160deg, #5ac8fa, #1e7cf2)", ANNOUNCE: "linear-gradient(160deg, #d77bf5, #9b3fe0)",
    OTHER: "linear-gradient(160deg, #b8b8be, #8a8a93)"
  };
  const MAIN = ["project", "repo", "kind", "text", "combo", "choice", "multi", "date", "time", "links"];

  let form = null, type = null, fixOf = null, sending = false, locked = false, finished = false;
  let values = {};
  let toggles = {};
  let confirmed = new Set();
  const files = {DB: [], ENV: [], OTHER: []};

  function haptic() {
    try {
      tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged();
    } catch (e) { /* no haptics here */ }
  }

  if (tg) {
    tg.ready();
    tg.expand();
    try {
      tg.setHeaderColor && tg.setHeaderColor("secondary_bg_color");
      tg.setBackgroundColor && tg.setBackgroundColor("secondary_bg_color");
    } catch (e) { /* older clients */ }
  }

  function fail(message) {
    const box = $("error");
    box.textContent = message;
    box.hidden = false;
    window.scrollTo({top: 0, behavior: "smooth"});
  }

  // ---------------------------------------------------------------- draft

  function draftKey() {
    return "devops-form-draft:" + (form ? form.user : "");
  }

  function saveDraft() {
    if (fixOf || finished) {
      return;
    }
    try {
      localStorage.setItem(draftKey(), JSON.stringify({type: type && type.code, values, toggles, confirmed: [...confirmed]}));
    } catch (e) { /* storage off: the draft is just not kept */ }
  }

  function loadDraft() {
    try {
      return JSON.parse(localStorage.getItem(draftKey()) || "null");
    } catch (e) {
      return null;
    }
  }

  function clearDraft() {
    try {
      localStorage.removeItem(draftKey());
    } catch (e) { /* nothing kept */ }
  }

  function set(key, value) {
    if (value && String(value).trim()) {
      values[key] = value;
    } else {
      delete values[key];
    }
    const cell = document.querySelector("[data-key='" + CSS.escape(key) + "']");
    if (cell) {
      cell.classList.remove("invalid");
    }
    saveDraft();
  }

  // ---------------------------------------------------------------- loading

  async function load() {
    if (!initData) {
      $("who").textContent = "Откройте форму из Telegram — кнопкой «📝 Подать заявку» в канале.";
      return;
    }
    let res;
    try {
      res = await fetch("/miniapp/api/form", {headers: {"X-Telegram-Init-Data": initData}});
    } catch (e) {
      $("who").textContent = "";
      fail("Сервер заявок недоступен — проверьте связь и откройте форму снова.");
      return;
    }
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      $("who").textContent = "";
      fail(body.error || "Форма не загрузилась — откройте её снова.");
      return;
    }
    form = body;
    $("who").textContent = form.user + " · " + form.role;
    const initial = (form.user || "").replace(/^@/, "").charAt(0).toUpperCase();
    if (initial) {
      $("avatar").textContent = initial;
    }
    renderLauncher();
    const start = tg && tg.initDataUnsafe ? tg.initDataUnsafe.start_param || "" : "";
    if (form.prefill) {
      fixOf = form.prefill.number;
      values = Object.assign({}, form.prefill.values || {});
      confirmed = new Set(form.prefill.confirmed || []);
      const box = $("fix");
      box.innerHTML = "<span>✏️</span><span><b>Исправление " + esc(fixOf) + "</b>"
        + (form.prefill.reason ? "<br>Причина возврата: " + esc(form.prefill.reason) : "")
        + "<br><span class='hint'>Исправьте и отправьте — номер заявки сохранится.</span></span>";
      box.hidden = false;
      choose(form.prefill.type, true);
      return;
    }
    const draft = loadDraft();
    if (draft && draft.type) {
      values = draft.values || {};
      toggles = draft.toggles || {};
      confirmed = new Set(draft.confirmed || []);
    }
    if (start.startsWith("type_")) {
      // «startapp=type_hotfix» from /hotfix in the private chat: that type, open
      const t = form.types.find(x => x.code.toLowerCase() === start.substring(5));
      if (t) {
        choose(t.code, false);
        return;
      }
    }
    if (draft && draft.type) {
      choose(draft.type, false);
    }
  }

  function renderLauncher() {
    $("picker").hidden = false;
    const box = $("types");
    box.innerHTML = "";
    form.types.forEach((t, i) => {
      const b = el("button", "app type", "<span class='sq' style='--g:" + (GRADIENT[t.code] || GRADIENT.OTHER) + "' aria-hidden='true'>" + esc(t.emoji)
        + "</span><span class='t'>" + esc(t.title) + "</span>");
      b.type = "button";
      b.dataset.code = t.code;
      b.style.animationDelay = (i * 25) + "ms";
      b.addEventListener("click", () => {
        haptic();
        choose(t.code, false);
      });
      box.appendChild(b);
    });
  }

  function choose(code, lock) {
    const t = form.types.find(x => x.code === code);
    if (!t) {
      return;
    }
    if (type && type.code !== code) {
      confirmed = new Set();
    }
    type = t;
    locked = lock;
    $("picker").hidden = true;
    renderForm();
    showSend();
    saveDraft();
    window.scrollTo({top: 0});
  }

  // ---------------------------------------------------------------- the form

  function group(title, nodes, footer) {
    const g = el("section", "group");
    if (title) {
      g.appendChild(el("div", "group-h", esc(title)));
    }
    const card = el("div", "card");
    nodes.forEach(n => card.appendChild(n));
    g.appendChild(card);
    if (footer) {
      g.appendChild(el("div", "group-f", esc(footer)));
    }
    return g;
  }

  function caption(f) {
    return "<span class='cap'><span aria-hidden='true'>" + esc(f.icon) + "</span><span>" + esc(f.key) + "</span></span>";
  }

  function label(f) {
    return "<span class='lb'><span class='ic' aria-hidden='true'>" + esc(f.icon) + "</span><span>" + esc(f.key) + "</span></span>";
  }

  function renderForm() {
    const box = $("form");
    box.innerHTML = "";
    box.style.display = "grid";
    box.style.gap = "22px";
    box.appendChild(group("Тип заявки", [typeCell()]));
    const main = type.fields.filter(f => MAIN.includes(f.kind));
    if (main.length) {
      box.appendChild(group("Заявка", main.map(cellOf)));
    }
    const notes = type.fields.filter(f => f.kind === "note");
    if (notes.length) {
      box.appendChild(group("Подробности", notes.map(cellOf)));
    }
    const changes = type.fields.filter(f => CATEGORY[f.kind]);
    if (changes.length) {
      box.appendChild(group("Изменения и файлы", changes.map(cellOf),
        "Пароли и токены не пишите — бот заменит значения на ***; файлы увидят только DevOps / SRE."));
    }
    if ((type.confirmations || []).length) {
      box.appendChild(group("Готовность", type.confirmations.map(checkCell), "Отметьте, что уже сделано — DevOps увидят это в карточке."));
    }
    box.hidden = false;
    box.querySelectorAll("textarea").forEach(grow);
  }

  function typeCell() {
    const cell = el(locked ? "div" : "button", "cell row type-row",
      "<span class='sq sm' style='--g:" + (GRADIENT[type.code] || GRADIENT.OTHER) + "' aria-hidden='true'>" + esc(type.emoji) + "</span>"
      + "<span class='grow'><div class='tt'>" + esc(type.title) + "</div>" + (type.who ? "<div class='ts'>" + esc(type.who) + "</div>" : "") + "</span>"
      + (locked ? "" : "<span class='change'>Изменить " + CHEVRON + "</span>"));
    if (!locked) {
      cell.type = "button";
      cell.addEventListener("click", () => openSheet({
        title: "Тип заявки", value: type.code, search: false,
        options: form.types.map(t => ({value: t.code, label: t.emoji + " " + t.title, sub: t.who})),
        onPick: v => choose(v, false)
      }));
    }
    return cell;
  }

  function cellOf(f) {
    switch (f.kind) {
      case "project":
      case "repo":
      case "kind":
        return pickCell(f);
      case "choice":
        return choiceCell(f);
      case "multi":
        return multiCell(f);
      case "date":
      case "time":
        return whenCell(f);
      case "links":
        return linksCell(f);
      case "note":
        return noteCell(f);
      case "db":
        return dbCell(f);
      case "env":
        return envCell(f);
      case "files":
        return filesCell(f);
      default:
        return textCell(f);
    }
  }

  function projectNames() {
    const out = [];
    (form.projects || []).forEach(p => {
      if ((p.streams || []).length > 1) {
        p.streams.forEach(s => out.push(p.name + " " + s.name));
      } else {
        out.push(p.name);
      }
    });
    return out;
  }

  function reposOf(project) {
    const v = (project || "").trim().toLowerCase();
    const out = [];
    (form.projects || []).forEach(p => (p.streams || []).forEach(s => {
      if (!v || v === p.name.toLowerCase() || v === (p.name + " " + s.name).toLowerCase() || v === (s.code || "").toLowerCase()) {
        (s.repos || []).forEach(r => out.includes(r) || out.push(r));
      }
    }));
    return out;
  }

  // a value picked from a list (the registry's projects and repositories, the announcement kinds), or typed
  function pickCell(f) {
    const cell = el("button", "cell row");
    cell.type = "button";
    cell.dataset.key = f.key;
    const draw = () => {
      const v = values[f.key] || "";
      cell.innerHTML = label(f) + "<span class='val" + (v ? " on" : "") + "'>" + esc(v || (f.required ? "Выбрать" : "Не указан")) + "</span>" + CHEVRON;
    };
    draw();
    cell.addEventListener("click", () => {
      const list = f.kind === "project" ? projectNames() : f.kind === "repo" ? reposOf(values["Проект"]) : (form.announcementKinds || []);
      openSheet({
        title: f.key, value: values[f.key], custom: f.kind !== "kind", clear: !f.required && !!values[f.key],
        options: list.map(o => ({value: o, label: o})),
        onPick: v => {
          set(f.key, v);
          draw();
          if (f.kind === "project") {
            // the repository belongs to the project
            const repo = document.querySelector("[data-key='Репозиторий']");
            if (repo && values["Репозиторий"] && !reposOf(v).includes(values["Репозиторий"]) && reposOf(v).length) {
              set("Репозиторий", "");
              repo.replaceWith(pickCell(type.fields.find(x => x.kind === "repo")));
            }
          }
        }
      });
    });
    return cell;
  }

  function textCell(f) {
    const cell = el("label", "cell stack", caption(f));
    cell.dataset.key = f.key;
    const input = el("input");
    input.type = "text";
    input.autocomplete = "off";
    input.value = values[f.key] || "";
    input.placeholder = f.sample || f.hint || "";
    if (f.kind === "combo" && (f.options || []).length) {
      const id = "dl_" + type.fields.indexOf(f);
      let list = document.getElementById(id);
      if (!list) {
        list = el("datalist");
        list.id = id;
        document.body.appendChild(list);
      }
      list.innerHTML = f.options.map(o => "<option value='" + esc(o) + "'>").join("");
      input.setAttribute("list", id);
    }
    input.addEventListener("input", () => set(f.key, input.value));
    cell.appendChild(input);
    return cell;
  }

  function grow(t) {
    t.style.height = "auto";
    t.style.height = t.scrollHeight + "px";
  }

  function noteCell(f) {
    const cell = el("label", "cell stack", caption(f));
    cell.dataset.key = f.key;
    const t = el("textarea");
    t.rows = 1;
    t.value = values[f.key] || "";
    t.placeholder = f.hint || f.sample || "";
    t.addEventListener("input", () => {
      grow(t);
      set(f.key, t.value);
    });
    cell.appendChild(t);
    return cell;
  }

  // one of a few: a segmented control
  function choiceCell(f) {
    const cell = el("div", "cell row", label(f));
    cell.dataset.key = f.key;
    const seg = el("div", "seg");
    seg.setAttribute("role", "group");
    seg.setAttribute("aria-label", f.key);
    const current = (f.options || []).find(o => o.toLowerCase() === String(values[f.key] || "").trim().toLowerCase());
    if (values[f.key] && !current) {
      // a value outside the choices (an older request): kept as typed
      return textCell(f);
    }
    (f.options || []).forEach(o => {
      const b = el("button", null, esc(o));
      b.type = "button";
      b.setAttribute("aria-pressed", String(o === current));
      b.addEventListener("click", () => {
        const on = values[f.key] === o ? "" : o;
        set(f.key, on);
        seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.textContent === on)));
        haptic();
      });
      seg.appendChild(b);
    });
    cell.appendChild(seg);
    return cell;
  }

  // several of a few: toggle chips
  function multiCell(f) {
    const cell = el("div", "cell row", label(f));
    cell.dataset.key = f.key;
    const picked = new Set(String(values[f.key] || "").split(/[,;\s]+/).map(x => x.toLowerCase()).filter(Boolean));
    const chips = el("div", "chips");
    (f.options || []).forEach(o => {
      const b = el("button", "chip", esc(o));
      b.type = "button";
      b.setAttribute("aria-pressed", String(picked.has(o.toLowerCase())));
      b.addEventListener("click", () => {
        b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed") !== "true"));
        set(f.key, [...chips.querySelectorAll("[aria-pressed=true]")].map(x => x.textContent).join(", "));
        haptic();
      });
      chips.appendChild(b);
    });
    cell.appendChild(chips);
    return cell;
  }

  // a date or a time: the phone's own picker
  function whenCell(f) {
    const v = values[f.key] || "";
    const fits = f.kind === "date" ? /^\d{4}-\d{2}-\d{2}$/ : /^\d{2}:\d{2}$/;
    if (v && !fits.test(v)) {
      return textCell(f);
    }
    const cell = el("label", "cell row", label(f));
    cell.dataset.key = f.key;
    const input = el("input", "inline-input");
    input.type = f.kind;
    input.value = v;
    input.addEventListener("input", () => set(f.key, input.value));
    cell.appendChild(input);
    return cell;
  }

  // one or more links: a line each, «+ Ещё ссылка»
  function linksCell(f) {
    const cell = el("div", "cell");
    cell.dataset.key = f.key;
    const cap = el("div", "stack", caption(f));
    cap.style.paddingBottom = "0";
    cell.appendChild(cap);
    const lines = el("div", "lines");
    cell.appendChild(lines);
    let items = String(values[f.key] || "").split(/\s*\n\s*/).filter(Boolean);
    if (!items.length) {
      items = [""];
    }
    const sync = () => set(f.key, items.map(s => s.trim()).filter(Boolean).join("\n"));
    const draw = focusLast => {
      lines.innerHTML = "";
      items.forEach((v, i) => {
        const line = el("div", "line");
        const input = el("input");
        input.type = "text";
        input.inputMode = "url";
        input.autocomplete = "off";
        input.autocapitalize = "off";
        input.value = v;
        input.placeholder = i ? "Ещё ссылка" : (f.sample || f.hint || "");
        input.setAttribute("aria-label", f.key + " " + (i + 1));
        input.addEventListener("input", () => {
          items[i] = input.value;
          sync();
        });
        line.appendChild(input);
        if (items.length > 1) {
          const x = el("button", "x", "✕");
          x.type = "button";
          x.setAttribute("aria-label", "Убрать ссылку");
          x.addEventListener("click", () => {
            items.splice(i, 1);
            sync();
            draw(false);
          });
          line.appendChild(x);
        }
        lines.appendChild(line);
        if (focusLast && i === items.length - 1) {
          setTimeout(() => input.focus(), 0);
        }
      });
      const add = el("button", "line add tap", "<span class='plus' aria-hidden='true'>+</span><span>Ещё ссылка</span>");
      add.type = "button";
      add.addEventListener("click", () => {
        items.push("");
        draw(true);
      });
      lines.appendChild(add);
    };
    draw(false);
    return cell;
  }

  // a switch row; when on, its lines show under it
  function switchHead(f, on, onChange) {
    const head = el("div", "row", label(f));
    const sw = el("button", "switch");
    sw.type = "button";
    sw.setAttribute("role", "switch");
    sw.setAttribute("aria-checked", String(on));
    sw.setAttribute("aria-label", f.key);
    sw.addEventListener("click", () => {
      const next = sw.getAttribute("aria-checked") !== "true";
      sw.setAttribute("aria-checked", String(next));
      haptic();
      onChange(next);
    });
    head.appendChild(sw);
    return head;
  }

  function isOn(f) {
    return toggles[f.key] !== undefined ? toggles[f.key] : !!(values[f.key] || files[CATEGORY[f.kind]].length);
  }

  // «🗄 Изменения БД — Liquibase changelog, SQL» describes the field of that name: only what follows the name
  function hintOf(f) {
    const parts = (f.hint || "").split(" — ");
    return parts.length > 1 && parts[0].includes(f.key) ? parts.slice(1).join(" — ") : "";
  }

  function dbCell(f) {
    const cell = el("div", "cell");
    cell.dataset.key = f.key;
    const body = el("div", "lines");
    const t = el("textarea");
    t.rows = 1;
    t.value = values[f.key] || "";
    t.placeholder = "Ссылка на MR или SQL текстом";
    t.addEventListener("input", () => {
      grow(t);
      set(f.key, t.value);
    });
    const text = el("label", "line");
    text.appendChild(t);
    t.style.cssText = "width:100%;border:0;outline:0;background:transparent;resize:none;padding:4px 0;font-size:16px;overflow:hidden";
    body.appendChild(text);
    fileLines(body, CATEGORY[f.kind], hintOf(f));
    const on = isOn(f);
    body.hidden = !on;
    cell.appendChild(switchHead(f, on, next => {
      toggles[f.key] = next;
      body.hidden = !next;
      saveDraft();
      if (next) {
        grow(t);
      }
    }));
    cell.appendChild(body);
    return cell;
  }

  // KEY=VALUE lines as two inputs each; lines that are no variable (a file's name) are kept as they are
  function envCell(f) {
    const cell = el("div", "cell");
    cell.dataset.key = f.key;
    const body = el("div", "lines");
    const all = String(values[f.key] || "").split(/\n/).map(s => s.trim()).filter(Boolean);
    const rows = all.filter(s => /^[^=\s]+\s*=/.test(s)).map(s => ({k: s.split("=")[0].trim(), v: s.substring(s.indexOf("=") + 1).trim()}));
    const extra = all.filter(s => !/^[^=\s]+\s*=/.test(s));
    if (!rows.length) {
      rows.push({k: "", v: ""});
    }
    const sync = () => set(f.key, rows.filter(r => r.k.trim()).map(r => r.k.trim() + "=" + r.v.trim()).concat(extra).join("\n"));
    const list = el("div");
    const draw = focusLast => {
      list.innerHTML = "";
      rows.forEach((r, i) => {
        const line = el("div", "line kv");
        const k = el("input");
        k.placeholder = "KEY";
        k.value = r.k;
        k.autocapitalize = "characters";
        k.autocomplete = "off";
        k.spellcheck = false;
        k.style.flex = "1 1 40%";
        k.setAttribute("aria-label", "Переменная " + (i + 1));
        const v = el("input");
        v.placeholder = "значение или ***";
        v.value = r.v;
        v.autocapitalize = "off";
        v.autocomplete = "off";
        v.spellcheck = false;
        v.style.flex = "1 1 60%";
        v.setAttribute("aria-label", "Значение " + (i + 1));
        k.addEventListener("input", () => {
          r.k = k.value;
          sync();
        });
        v.addEventListener("input", () => {
          r.v = v.value;
          sync();
        });
        line.appendChild(k);
        line.appendChild(el("span", "eq", "="));
        line.appendChild(v);
        if (rows.length > 1) {
          const x = el("button", "x", "✕");
          x.type = "button";
          x.setAttribute("aria-label", "Убрать переменную");
          x.addEventListener("click", () => {
            rows.splice(i, 1);
            sync();
            draw(false);
          });
          line.appendChild(x);
        }
        list.appendChild(line);
        if (focusLast && i === rows.length - 1) {
          setTimeout(() => k.focus(), 0);
        }
      });
      const add = el("button", "line add tap", "<span class='plus' aria-hidden='true'>+</span><span>Переменная</span>");
      add.type = "button";
      add.addEventListener("click", () => {
        rows.push({k: "", v: ""});
        draw(true);
      });
      list.appendChild(add);
    };
    draw(false);
    body.appendChild(list);
    fileLines(body, CATEGORY[f.kind], hintOf(f) || "env-файл");
    const on = isOn(f);
    body.hidden = !on;
    cell.appendChild(switchHead(f, on, next => {
      toggles[f.key] = next;
      body.hidden = !next;
      saveDraft();
    }));
    cell.appendChild(body);
    return cell;
  }

  function filesCell(f) {
    const cell = el("div", "cell");
    cell.dataset.key = f.key;
    const head = el("div", "row", label(f));
    cell.appendChild(head);
    const body = el("div", "lines");
    fileLines(body, CATEGORY[f.kind], hintOf(f));
    cell.appendChild(body);
    return cell;
  }

  function size(bytes) {
    return bytes < 1024 ? bytes + " Б" : bytes < 1048576 ? Math.round(bytes / 1024) + " КБ" : (bytes / 1048576).toFixed(1) + " МБ";
  }

  function fileIcon(name) {
    const ext = (name.split(".").pop() || "").toLowerCase();
    return ["sql", "xml", "yaml", "yml"].includes(ext) ? "🗄" : ["env", "properties", "conf"].includes(ext) ? "⚙️"
      : ["png", "jpg", "jpeg", "gif", "webp", "heic"].includes(ext) ? "🖼" : ["log", "txt"].includes(ext) ? "📄" : "📎";
  }

  // the files of a category, one line each, and «Приложить файл»
  function fileLines(box, category, hint) {
    const list = el("div");
    const picker = el("input");
    picker.type = "file";
    picker.multiple = true;
    picker.hidden = true;
    const add = el("button", "line add tap", "<span class='plus' aria-hidden='true'>+</span><span>Приложить файл</span>"
      + (hint ? "<span class='s'>" + esc(hint) + "</span>" : ""));
    add.type = "button";
    add.addEventListener("click", () => picker.click());
    picker.addEventListener("change", () => {
      Array.from(picker.files || []).forEach(file => files[category].push(file));
      picker.value = "";
      draw();
      haptic();
    });
    function draw() {
      list.innerHTML = "";
      files[category].forEach((file, i) => {
        const line = el("div", "line file", "<span class='fi' aria-hidden='true'>" + fileIcon(file.name) + "</span><span class='nm'>" + esc(file.name)
          + "</span><span class='sz'>" + size(file.size) + "</span>");
        const x = el("button", "x", "✕");
        x.type = "button";
        x.setAttribute("aria-label", "Убрать " + file.name);
        x.addEventListener("click", () => {
          files[category].splice(i, 1);
          draw();
        });
        line.appendChild(x);
        list.appendChild(line);
      });
    }
    draw();
    box.appendChild(list);
    box.appendChild(add);
    box.appendChild(picker);
  }

  function checkCell(text, i) {
    const cell = el("button", "cell row", "<span class='tick' aria-hidden='true'>" + CHECK + "</span><span class='grow'>" + esc(text) + "</span>");
    cell.type = "button";
    cell.setAttribute("role", "checkbox");
    cell.setAttribute("aria-checked", String(confirmed.has(i)));
    cell.addEventListener("click", () => {
      if (confirmed.has(i)) {
        confirmed.delete(i);
      } else {
        confirmed.add(i);
      }
      cell.setAttribute("aria-checked", String(confirmed.has(i)));
      haptic();
      saveDraft();
    });
    return cell;
  }

  // ---------------------------------------------------------------- the bottom sheet

  let closeSheet = null;

  function openSheet(o) {
    const sheet = $("sheet"), back = $("sheetBack"), list = $("sheetList"), search = $("sheetSearch");
    $("sheetTitle").textContent = o.title;
    search.value = "";
    $("sheetSearchBox").hidden = o.search === false || (!o.custom && o.options.length < 8);
    search.placeholder = o.custom ? "Поиск или своё значение" : "Поиск";
    const draw = () => {
      const q = search.value.trim();
      const lq = q.toLowerCase();
      list.innerHTML = "";
      const shown = o.options.filter(x => !lq || x.label.toLowerCase().includes(lq) || (x.sub || "").toLowerCase().includes(lq));
      if (o.custom && q && !o.options.some(x => x.label.toLowerCase() === lq)) {
        shown.unshift({value: q, label: "Использовать «" + q + "»", custom: true});
      }
      if (o.clear && !q) {
        shown.push({value: "", label: "Не указывать", muted: true});
      }
      shown.forEach(x => {
        const b = el("button", "opt" + (x.custom ? " custom" : "") + (x.muted ? " muted" : ""),
          "<span class='ol'><span>" + esc(x.label) + "</span>" + (x.sub ? "<span class='os'>" + esc(x.sub) + "</span>" : "") + "</span>"
          + (!x.custom && !x.muted && x.value === o.value ? "<span class='ok'>" + CHECK.replace("width='13' height='13'", "width='18' height='18'") + "</span>" : ""));
        b.type = "button";
        b.addEventListener("click", () => {
          close();
          haptic();
          o.onPick(x.value);
        });
        list.appendChild(b);
      });
      if (!shown.length) {
        list.appendChild(el("div", "empty", o.custom ? "Введите название в поиске — оно и будет значением" : "Ничего не найдено"));
      }
    };
    const close = () => {
      back.classList.remove("on");
      sheet.classList.remove("on");
      setTimeout(() => {
        sheet.hidden = true;
        back.hidden = true;
      }, 220);
      if (tg && tg.BackButton) {
        tg.BackButton.offClick(close);
        tg.BackButton.hide();
      }
      closeSheet = null;
      showSend();
    };
    search.oninput = draw;
    search.onkeydown = e => {
      if (e.key === "Enter" && o.custom && search.value.trim()) {
        close();
        o.onPick(search.value.trim());
      }
    };
    draw();
    back.hidden = false;
    sheet.hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      back.classList.add("on");
      sheet.classList.add("on");
    }));
    back.onclick = close;
    $("sheetDone").onclick = close;
    closeSheet = close;
    if (tg && tg.BackButton) {
      tg.BackButton.onClick(close);
      tg.BackButton.show();
    }
    if (tg && tg.MainButton) {
      tg.MainButton.hide();
    }
    if (o.custom && !o.options.length) {
      setTimeout(() => search.focus(), 250);
    }
  }

  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && closeSheet) {
      closeSheet();
    }
  });

  // ---------------------------------------------------------------- sending

  function showSend() {
    if (!type || finished) {
      return;
    }
    const text = fixOf ? "Отправить исправление" : "Отправить заявку";
    if (tg && tg.MainButton) {
      tg.MainButton.setText(text);
      tg.MainButton.show();
    } else {
      $("fallbackSend").textContent = text;
      $("fallbackSend").hidden = false;
    }
  }

  // a field switched off is not sent, nor its files
  function active(f) {
    return !(f.kind === "db" || f.kind === "env") || isOn(f);
  }

  function sentFiles() {
    const out = {DB: [], ENV: [], OTHER: []};
    type.fields.filter(f => CATEGORY[f.kind] && active(f)).forEach(f => out[CATEGORY[f.kind]] = files[CATEGORY[f.kind]]);
    return out;
  }

  function missing() {
    const sent = sentFiles();
    return type.fields.filter(f => f.required && !(values[f.key] || "").trim() && !(CATEGORY[f.kind] && sent[CATEGORY[f.kind]].length));
  }

  // The server's limits, checked here: a larger upload is cut off on the way and would fail with no explanation.
  function oversize() {
    const all = [].concat(...Object.values(sentFiles()));
    const mb = bytes => Math.floor(bytes / 1048576) + " МБ";
    const limits = form.limits;
    if (all.length > limits.files) {
      return "Не больше " + limits.files + " файлов за раз — остальные пришлите кнопкой «📎 Прикрепить файлы» в личке с ботом.";
    }
    const big = all.find(file => file.size > limits.fileBytes);
    if (big) {
      return "«" + big.name + "» больше " + mb(limits.fileBytes) + " — дайте на него ссылку в описании.";
    }
    // the form's own part rides in the same request
    if (all.reduce((sum, file) => sum + file.size, 0) > limits.totalBytes - 65536) {
      return "Файлы вместе больше " + mb(limits.totalBytes) + " — приложите часть, на остальное дайте ссылку.";
    }
    return null;
  }

  function confirmMissing(list) {
    return new Promise(resolve => {
      if (!list.length) {
        resolve(true);
        return;
      }
      list.forEach(f => {
        const cell = document.querySelector("[data-key='" + CSS.escape(f.key) + "']");
        if (cell) {
          cell.classList.add("invalid");
        }
      });
      const first = document.querySelector(".invalid");
      if (first) {
        first.scrollIntoView({block: "center", behavior: "smooth"});
      }
      const text = "Не заполнено: " + list.map(f => f.key).join(", ") + ". Отправить всё равно?";
      if (tg && tg.showConfirm) {
        tg.showConfirm(text, ok => resolve(ok));
      } else {
        resolve(window.confirm(text));
      }
    });
  }

  async function send() {
    if (!type || sending || closeSheet) {
      return;
    }
    const tooLarge = oversize();
    if (tooLarge) {
      fail(tooLarge);
      return;
    }
    if (!(await confirmMissing(missing()))) {
      return;
    }
    sending = true;
    $("error").hidden = true;
    if (tg && tg.MainButton) {
      tg.MainButton.showProgress(false);
    }
    const data = new FormData();
    const payload = {type: type.code, values: {}, confirmed: [...confirmed].sort((a, b) => a - b), fixOf};
    type.fields.filter(active).forEach(f => {
      if ((values[f.key] || "").trim()) {
        payload.values[f.key] = values[f.key];
      }
    });
    data.append("form", new Blob([JSON.stringify(payload)], {type: "application/json"}));
    const sent = sentFiles();
    Object.keys(sent).forEach(c => sent[c].forEach(file => data.append(c, file, file.name)));
    try {
      const res = await fetch("/miniapp/api/requests", {method: "POST", headers: {"X-Telegram-Init-Data": initData}, body: data});
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        fail(body.error || "Заявка не отправлена — попробуйте ещё раз.");
        return;
      }
      clearDraft();
      done(body);
    } catch (e) {
      fail("Сервер заявок недоступен — заявка не отправлена, попробуйте ещё раз.");
    } finally {
      sending = false;
      if (tg && tg.MainButton) {
        tg.MainButton.hideProgress();
      }
    }
  }

  function done(result) {
    finished = true;
    ["form", "picker", "fix", "error", "fallbackSend"].forEach(id => $(id).hidden = true);
    $("title").textContent = "Готово";
    if (tg && tg.MainButton) {
      tg.MainButton.hide();
    }
    try {
      tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success");
    } catch (e) { /* no haptics here */ }
    const box = $("done");
    box.innerHTML = "<div class='badge'>" + CHECK.replace("width='13' height='13'", "width='36' height='36'") + "</div>"
      + "<h2>" + esc(result.number) + " отправлена</h2>"
      + "<p>Заявка — постом в канале, статус и вопросы — в комментариях к нему. Новости по ней бот пришлёт в личку.</p>"
      + (result.hidden && result.hidden.length ? "<p>🔒 Скрыто (***): " + esc(result.hidden.join(", ")) + "</p>" : "")
      + (result.failedFiles && result.failedFiles.length ? "<div class='alert error'>⚠️ Не переданы файлы: " + esc(result.failedFiles.join(", "))
        + " — пришлите их кнопкой «📎 Прикрепить файлы» в личке с ботом.</div>" : "");
    const actions = el("div", "actions");
    if (result.postUrl) {
      const open = el("button", "btn", "Открыть пост заявки");
      open.type = "button";
      open.addEventListener("click", () => tg && tg.openTelegramLink ? tg.openTelegramLink(result.postUrl) : window.open(result.postUrl));
      actions.appendChild(open);
    }
    const close = el("button", "btn plain", "Закрыть");
    close.type = "button";
    close.addEventListener("click", () => tg ? tg.close() : window.close());
    actions.appendChild(close);
    box.appendChild(actions);
    box.hidden = false;
    window.scrollTo({top: 0});
  }

  if (tg && tg.MainButton) {
    tg.MainButton.onClick(send);
  }
  $("fallbackSend").addEventListener("click", send);
  load();
})();
</script>
</body>
</html>
