<main id="app">
  <button class="back" id="back" type="button" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>Назад</button>

<button class="btn" id="fallbackSend" type="button" hidden>Далее</button>
<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const initData = tg ? tg.initData : "";
  const nativeBack = !!(tg && tg.BackButton && (!tg.isVersionAtLeast || tg.isVersionAtLeast("6.1")));
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  const el = (tag, cls, html) => {
    const e = document.createElement(tag);
    if (cls) {
      e.className = cls;
    }
    if (html != null) {
      e.innerHTML = html;
    }
    return e;
  };
  const svg = (paths, size, width) => "<svg width='" + size + "' height='" + size + "' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='"
    + (width || 1.8) + "' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'>" + paths + "</svg>";
  const ICON = {
    DEPLOY: "<circle cx='12' cy='12' r='9'/><path d='M12 16V8M8.5 11.5 12 8l3.5 3.5'/>",
    HOTFIX: "<path d='M12 3c1.2 3.2 5 4.8 5 9.5a5 5 0 0 1-10 0c0-2 .8-3.4 2-4.5.2 1.6 1 2.6 2.2 2.6 0-3-.6-5.2.8-7.6Z'/>",
    ROLLBACK: "<path d='M4 5v5h5'/><path d='M5.2 14.5A7.5 7.5 0 1 0 6.3 7.3L4 10'/>",
    INFRA: "<rect x='4' y='4' width='16' height='6' rx='2'/><rect x='4' y='14' width='16' height='6' rx='2'/><path d='M8 7h.01M8 17h.01'/>",
    ACCESS: "<circle cx='8' cy='15' r='4'/><path d='m10.8 12.2 7.7-7.7M16 7l2 2M13.5 9.5 15 11'/>",
    INCIDENT: "<path d='M12 4 2.8 19.5h18.4Z'/><path d='M12 10v4M12 17h.01'/>",
    MOBILE: "<rect x='7' y='3' width='10' height='18' rx='2.5'/><path d='M11 17.5h2'/>",
    ANNOUNCE: "<path d='M4 10v4h3l7 4V6l-7 4Z'/><path d='M18 9.5a3.5 3.5 0 0 1 0 5'/>",
    OTHER: "<path d='M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z'/><path d='M14 3v5h5M9 13h6M9 17h4'/>",
    check: "<path d='M5 12.5 10 17.5 19 7'/>",
    x: "<path d='M6 6l12 12M18 6 6 18'/>",
    plus: "<path d='M12 5v14M5 12h14'/>",
    search: "<circle cx='11' cy='11' r='6.5'/><path d='m20 20-4.2-4.2'/>",
    merge: "<circle cx='6' cy='6' r='2.5'/><circle cx='6' cy='18' r='2.5'/><circle cx='18' cy='15' r='2.5'/><path d='M6 8.5v7M6 8.5c0 4 4 6.5 9.5 6.5'/>",
    clip: "<path d='m20 11.5-7.8 7.8a5 5 0 0 1-7-7l8.2-8.2a3.4 3.4 0 0 1 4.8 4.8l-8.2 8.1a1.7 1.7 0 0 1-2.4-2.4l7.5-7.5'/>",
    db: "<ellipse cx='12' cy='6' rx='7' ry='3'/><path d='M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3'/>",
    env: "<path d='M4 7h10M18 7h2M4 17h4M12 17h8'/><circle cx='16' cy='7' r='2'/><circle cx='10' cy='17' r='2'/>",
    lock: "<rect x='5' y='11' width='14' height='9' rx='2'/><path d='M8 11V8a4 4 0 0 1 8 0v3'/>",
    clock: "<circle cx='12' cy='12' r='9'/><path d='M12 7v5l3 2'/>"
  };
  // each type's colour: icon strokes, tinted squares
  const COLOR = {DEPLOY: "#5468e8", HOTFIX: "#e0612b", ROLLBACK: "#6b7891", INFRA: "#1f9c76", ACCESS: "#c98a0c", INCIDENT: "#d93a5b",
    MOBILE: "#2b86d9", ANNOUNCE: "#9454d6", OTHER: "#85857c"};
  const WHERE = ["project", "repo", "kind"];
  const FILES = {db: "DB", env: "ENV", files: "OTHER"};
  const SECRET = /(PASS|SECRET|TOKEN|PWD|PRIVATE|API_?KEY|_KEY$)/i;
  const WHERE_TITLE = {INFRA: "Для какого проекта?", INCIDENT: "Где сломалось?", ANNOUNCE: "Что объявляем?"};
  const DETAILS_TITLE = {DEPLOY: "Что выкатываем?", HOTFIX: "Что выкатываем?", ROLLBACK: "Что откатываем?", INFRA: "Что нужно сделать?",
    ACCESS: "Какой доступ нужен?", INCIDENT: "Что случилось?", MOBILE: "Какая сборка?", ANNOUNCE: "Детали объявления", OTHER: "Что нужно сделать?"};

  let form = null, type = null, fixOf = null, locked = false, sending = false, finished = false;
  let steps = [], step = 0, query = "";
  let values = {}, toggles = {}, confirmed = new Set();
  const files = {DB: [], ENV: [], OTHER: []};
  const customRepo = {on: false};

  function haptic(kind) {
    try {
      if (tg && tg.HapticFeedback) {
        kind ? tg.HapticFeedback.notificationOccurred(kind) : tg.HapticFeedback.selectionChanged();
      }
    } catch (e) { /* no haptics here */ }
  }

  if (tg) {
    try {
      tg.ready();
      tg.expand();
      tg.setHeaderColor && tg.setHeaderColor("secondary_bg_color");
      tg.setBackgroundColor && tg.setBackgroundColor("secondary_bg_color");
    } catch (e) { /* older clients */ }
  }

  function fail(message) {
    const box = $("error");
    box.textContent = message;
    box.hidden = false;
    window.scrollTo({top: 0, behavior: "smooth"});
  }

  // ---------------------------------------------------------------- draft

  function draftKey() {
    return "devops-form-draft:" + (form ? form.user : "");
  }

  function saveDraft() {
    if (fixOf || finished) {
      return;
    }
    try {
      localStorage.setItem(draftKey(), JSON.stringify({type: type && type.code, values, toggles, confirmed: [...confirmed]}));
    } catch (e) { /* storage off: the draft is just not kept */ }
  }

  function loadDraft() {
    try {
      return JSON.parse(localStorage.getItem(draftKey()) || "null");
    } catch (e) {
      return null;
    }
  }

  function clearDraft() {
    try {
      localStorage.removeItem(draftKey());
    } catch (e) { /* nothing kept */ }
  }

  function set(key, value) {
    if (value && String(value).trim()) {
      values[key] = value;
    } else {
      delete values[key];
    }
    const field = document.querySelector("[data-key='" + CSS.escape(key) + "']");
    if (field) {
      field.classList.remove("invalid");
    }
    saveDraft();
  }

  // ---------------------------------------------------------------- loading

  async function load() {
    if (!initData) {
      $("sub").textContent = "Откройте форму из Telegram — кнопкой «📝 Подать заявку» в канале.";
      return;
    }
    let res;
    try {
      res = await fetch("/miniapp/api/form", {headers: {"X-Telegram-Init-Data": initData}});
    } catch (e) {
      $("sub").textContent = "";
      fail("Сервер заявок недоступен — проверьте связь и откройте форму снова.");
      return;
    }
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      $("sub").textContent = "";
      fail(body.error || "Форма не загрузилась — откройте её снова.");
      return;
    }
    form = body;
    const start = tg && tg.initDataUnsafe ? tg.initDataUnsafe.start_param || "" : "";
    if (form.prefill) {
      // a returned request, fixed under its number: its type stays
      fixOf = form.prefill.number;
      values = Object.assign({}, form.prefill.values || {});
      confirmed = new Set(form.prefill.confirmed || []);
      type = form.types.find(t => t.code === form.prefill.type) || null;
      locked = !!type;
      const box = $("fix");
      box.innerHTML = "<b>Исправление " + esc(fixOf) + "</b>" + (form.prefill.reason ? "<p class='help'>Причина возврата: " + esc(form.prefill.reason) + "</p>" : "")
        + "<p class='help'>Исправьте и отправьте — номер заявки сохранится.</p>";
      box.hidden = false;
      step = 0;
      render();
      return;
    }
    const draft = loadDraft();
    if (draft && draft.type) {
      values = draft.values || {};
      toggles = draft.toggles || {};
      confirmed = new Set(draft.confirmed || []);
      type = form.types.find(t => t.code === draft.type) || null;
    }
    if (start.startsWith("type_")) {
      // «startapp=type_hotfix» from /hotfix in the private chat: that type, its first step
      const t = form.types.find(x => x.code.toLowerCase() === start.substring(5));
      if (t) {
        if (!type || type.code !== t.code) {
          confirmed = new Set();
        }
        type = t;
      }
    }
    step = type ? 1 : 0;
    render();
  }

  // ---------------------------------------------------------------- steps

  function computeSteps() {
    const out = [];
    if (!locked) {
      out.push("type");
    }
    if (type) {
      if (type.fields.some(f => WHERE.includes(f.kind))) {
        out.push("where");
      }
      if (type.fields.some(f => !WHERE.includes(f.kind) && !FILES[f.kind])) {
        out.push("details");
      }
      if (type.fields.some(f => FILES[f.kind])) {
        out.push("files");
      }
      out.push("review");
    }
    steps = out;
    step = Math.max(0, Math.min(step, steps.length - 1));
  }

  function fieldsOf(name) {
    if (!type) {
      return [];
    }
    if (name === "where") {
      return type.fields.filter(f => WHERE.includes(f.kind));
    }
    if (name === "details") {
      return type.fields.filter(f => !WHERE.includes(f.kind) && !FILES[f.kind]);
    }
    if (name === "files") {
      return type.fields.filter(f => FILES[f.kind]);
    }
    return [];
  }

  // the key of the type's field of that kind («Проект», «Репозиторий», «Объявление»)
  function keyOf(kind) {
    const f = type && type.fields.find(x => x.kind === kind);
    return f ? f.key : kind;
  }

  function context() {
    return fieldsOf("where").map(f => values[f.key]).filter(Boolean).join(" · ");
  }

  function render() {
    computeSteps();
    const name = steps[step];
    $("error").hidden = true;
    const total = type ? steps.length : 5;
    const progress = $("progress");
    progress.innerHTML = "";
    for (let i = 0; i < total; i++) {
      progress.appendChild(el("span", i <= step ? "is-on" : ""));
    }
    const head = {
      type: ["Что нужно от DevOps?", "Выберите тип — форма покажет только нужные поля."],
      where: [WHERE_TITLE[type && type.code] || "Где выкатываем?", "Проект и репозиторий из реестра — или впишите свой."],
      details: [DETAILS_TITLE[type && type.code] || "Детали", ""],
      files: ["Файлы и настройки", "Их увидят только DevOps / SRE. Пароли не пишите — бот заменит их на ***."],
      review: ["Проверьте заявку", "DevOps получат её ровно в таком виде."]
    }[name];
    const ctx = name === "details" || name === "files" ? context() : name === "where" ? type.title : "";
    $("eyebrow").textContent = "Шаг " + (step + 1) + " из " + total + (ctx ? " · " + ctx : "");
    $("title").textContent = head[0];
    $("sub").textContent = head[1];
    $("sub").hidden = !head[1];
    const box = $("step");
    box.innerHTML = "";
    box.className = "";
    void box.offsetWidth;
    box.className = "enter";
    ({type: renderType, where: renderWhere, details: renderDetails, files: renderFiles, review: renderReview})[name](box);
    box.querySelectorAll("textarea.input").forEach(grow);
    updateButtons();
    window.scrollTo({top: 0});
  }

  function go(delta) {
    step += delta;
    render();
  }

  function goTo(name) {
    const i = steps.indexOf(name);
    if (i >= 0) {
      step = i;
      render();
    }
  }

  // required fields of the step left empty: pointed at, and one confirm to go on anyway
  async function next() {
    const name = steps[step];
    if (name === "review") {
      send();
      return;
    }
    const miss = fieldsOf(name).filter(f => f.required && !filled(f));
    if (miss.length) {
      miss.forEach(f => {
        const node = document.querySelector("[data-key='" + CSS.escape(f.key) + "']");
        if (node) {
          node.classList.add("invalid");
        }
      });
      const first = document.querySelector(".invalid");
      if (first) {
        first.scrollIntoView({block: "center", behavior: "smooth"});
      }
      if (!(await ask("Не заполнено: " + miss.map(f => f.key).join(", ") + ". Продолжить без этого?"))) {
        return;
      }
    }
    go(1);
  }

  function ask(text) {
    return new Promise(resolve => {
      if (tg && tg.showConfirm && (!tg.isVersionAtLeast || tg.isVersionAtLeast("6.2"))) {
        tg.showConfirm(text, ok => resolve(ok));
      } else {
        resolve(window.confirm(text));
      }
    });
  }

  function back() {
    if (step > 0 && !finished) {
      go(-1);
    }
  }

  function updateButtons() {
    const name = steps[step];
    const label = name === "review" ? (fixOf ? "Отправить исправление" : "Отправить заявку") : "Далее";
    const showMain = !finished && name && name !== "type";
    if (tg && tg.MainButton) {
      tg.MainButton.setText(label);
      showMain ? tg.MainButton.show() : tg.MainButton.hide();
    } else {
      $("fallbackSend").textContent = label;
      $("fallbackSend").hidden = !showMain;
    }
    const canBack = step > 0 && !finished;
    if (nativeBack) {
      canBack ? tg.BackButton.show() : tg.BackButton.hide();
    } else {
      $("back").hidden = !canBack;
    }
  }

  // ---------------------------------------------------------------- step 1: the type

  function renderType(box) {
    const grid = el("div", "types");
    form.types.forEach((t, i) => {
      const wide = i === form.types.length - 1 && form.types.length % 2 === 1;
      const who = t.who ? t.who.charAt(0).toUpperCase() + t.who.slice(1) : "";
      const b = el("button", "tcard type" + (wide ? " wide" : ""),
        "<span class='badge'>" + svg(ICON.check, 14, 3) + "</span>"
        + "<span class='ico' style='--c:" + (COLOR[t.code] || COLOR.OTHER) + "'>" + svg(ICON[t.code] || ICON.OTHER, 22) + "</span>"
        + "<span class='tx'><span class='tname'>" + esc(t.title) + "</span>" + (who ? "<span class='twho'>" + esc(who) + "</span>" : "") + "</span>");
      b.type = "button";
      b.dataset.code = t.code;
      b.setAttribute("aria-pressed", String(!!type && type.code === t.code));
      b.addEventListener("click", () => {
        if (!type || type.code !== t.code) {
          confirmed = new Set();
        }
        type = t;
        grid.querySelectorAll(".tcard").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
        haptic();
        saveDraft();
        setTimeout(() => go(1), 160);
      });
      grid.appendChild(b);
    });
    box.appendChild(grid);
  }

  // ---------------------------------------------------------------- shared field parts

  function fieldBox(f, forId) {
    const wrap = el("div", "field");
    wrap.dataset.key = f.key;
    const lab = el(forId ? "label" : "div", "flabel", "<span>" + esc(f.key) + "</span>" + (f.required ? "" : "<span class='opt'>необязательно</span>"));
    if (forId) {
      lab.htmlFor = forId;
    }
    wrap.appendChild(lab);
    return wrap;
  }

  function help(text) {
    return el("p", "help", esc(text));
  }

  function filled(f) {
    if (FILES[f.kind]) {
      return !!(values[f.key] || "").trim() || files[FILES[f.kind]].length > 0;
    }
    return !!(values[f.key] || "").trim();
  }

  function grow(t) {
    t.style.height = "auto";
    t.style.height = Math.max(t.scrollHeight + 3, 92) + "px";
  }

  // ---------------------------------------------------------------- step 2: project, repository, announcement kind

  function projectNames() {
    const out = [];
    (form.projects || []).forEach(p => {
      if ((p.streams || []).length > 1) {
        p.streams.forEach(s => out.push({name: p.name + " " + s.name, repos: (s.repos || []).length}));
      } else {
        out.push({name: p.name, repos: (p.streams || []).reduce((n, s) => n + (s.repos || []).length, 0)});
      }
    });
    return out;
  }

  function reposOf(project) {
    const v = (project || "").trim().toLowerCase();
    const out = [];
    (form.projects || []).forEach(p => (p.streams || []).forEach(s => {
      if (v && (v === p.name.toLowerCase() || v === (p.name + " " + s.name).toLowerCase() || v === (s.code || "").toLowerCase())) {
        (s.repos || []).forEach(r => out.includes(r) || out.push(r));
      }
    }));
    return out;
  }

  function plural(n) {
    const m10 = n % 10, m100 = n % 100;
    return n + (m10 === 1 && m100 !== 11 ? " репозиторий" : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? " репозитория" : " репозиториев");
  }

  function renderWhere(box) {
    const list = el("div", "fields");
    fieldsOf("where").forEach(f => list.appendChild(f.kind === "project" ? projectField(f) : f.kind === "repo" ? repoField(f) : kindField(f)));
    box.appendChild(list);
  }

  function radioRow(name, sub, checked, onPick, cls) {
    const b = el("button", "row" + (cls ? " " + cls : ""), (cls === "custom" ? svg(ICON.plus, 20, 2.2) : "<span class='radio'></span>")
      + "<span class='tx'><span class='nm'>" + esc(name) + "</span>" + (sub ? "<span class='ds'>" + esc(sub) + "</span>" : "") + "</span>");
    b.type = "button";
    b.setAttribute("role", "radio");
    b.setAttribute("aria-checked", String(!!checked));
    b.addEventListener("click", () => {
      haptic();
      onPick();
    });
    return b;
  }

  function projectField(f) {
    const wrap = fieldBox(f, "f-search");
    const all = projectNames();
    const search = el("div", "search", svg(ICON.search, 20));
    const input = el("input");
    input.id = "f-search";
    input.type = "search";
    input.autocomplete = "off";
    input.placeholder = all.length ? "Найти или вписать свой" : (f.sample ? "Например: " + f.sample : "Название проекта");
    input.value = query;
    search.appendChild(input);
    wrap.appendChild(search);
    const list = el("div", "list");
    wrap.appendChild(list);
    const pick = name => {
      set(f.key, name);
      query = "";
      const repoKey = keyOf("repo");
      if (values[repoKey] && !reposOf(name).includes(values[repoKey]) && reposOf(name).length) {
        set(repoKey, "");
        customRepo.on = false;
      }
      render();
    };
    const draw = () => {
      list.innerHTML = "";
      const q = input.value.trim().toLowerCase();
      const shown = all.filter(p => !q || p.name.toLowerCase().includes(q));
      const current = values[f.key];
      if (current && !all.some(p => p.name === current)) {
        list.appendChild(radioRow(current, "своё название", true, () => {}));
      }
      shown.forEach(p => list.appendChild(radioRow(p.name, plural(p.repos), p.name === current, () => pick(p.name))));
      if (q && !all.some(p => p.name.toLowerCase() === q)) {
        list.appendChild(radioRow("Использовать «" + input.value.trim() + "»", "", false, () => pick(input.value.trim()), "custom"));
      }
      list.hidden = !list.children.length;
    };
    input.addEventListener("input", () => {
      query = input.value;
      draw();
    });
    input.addEventListener("keydown", e => {
      if (e.key === "Enter" && input.value.trim()) {
        pick(input.value.trim());
      }
    });
    draw();
    return wrap;
  }

  function repoField(f) {
    const repos = reposOf(values[keyOf("project")]);
    const current = values[f.key] || "";
    const typed = !!current && !repos.includes(current);
    const wrap = fieldBox(f, repos.length && !customRepo.on && !typed ? null : "f-repo");
    if (repos.length) {
      const chips = el("div", "chips");
      repos.forEach(r => {
        const c = el("button", "chip", (r === current ? svg(ICON.check, 16, 2.6) : "") + esc(r));
        c.type = "button";
        c.setAttribute("aria-pressed", String(r === current));
        c.addEventListener("click", () => {
          set(f.key, r === current ? "" : r);
          customRepo.on = false;
          haptic();
          render();
        });
        chips.appendChild(c);
      });
      const more = el("button", "chip more", svg(ICON.plus, 16, 2.2) + "Другой");
      more.type = "button";
      more.setAttribute("aria-pressed", String(customRepo.on || typed));
      more.addEventListener("click", () => {
        customRepo.on = true;
        if (repos.includes(current)) {
          set(f.key, "");
        }
        render();
        setTimeout(() => $("f-repo") && $("f-repo").focus(), 50);
      });
      chips.appendChild(more);
      wrap.appendChild(chips);
    }
    if (!repos.length || customRepo.on || typed) {
      const input = el("input", "input");
      input.id = "f-repo";
      input.autocomplete = "off";
      input.autocapitalize = "off";
      input.value = typed ? current : "";
      input.placeholder = f.sample ? "Например: " + f.sample : "Название репозитория";
      input.addEventListener("input", () => set(f.key, input.value));
      wrap.appendChild(input);
    }
    if (f.hint) {
      wrap.appendChild(help(f.hint));
    }
    return wrap;
  }

  function kindField(f) {
    const wrap = fieldBox(f, null);
    const list = el("div", "list");
    (form.announcementKinds || []).forEach(k => list.appendChild(radioRow(k, "", values[f.key] === k, () => {
      set(f.key, k);
      render();
    })));
    wrap.appendChild(list);
    return wrap;
  }

  // ---------------------------------------------------------------- step 3: details

  function renderDetails(box) {
    const list = el("div", "fields");
    fieldsOf("details").forEach((f, i) => list.appendChild(detailField(f, "f-d" + i)));
    box.appendChild(list);
  }

  function detailField(f, id) {
    switch (f.kind) {
      case "links":
        return linksField(f, id);
      case "note":
        return noteField(f, id);
      case "choice":
        return choiceField(f);
      case "multi":
        return multiField(f);
      case "date":
      case "time":
        return whenField(f, id);
      default:
        return textField(f, id);
    }
  }

  function textField(f, id) {
    const wrap = fieldBox(f, id);
    const input = el("input", "input");
    input.id = id;
    input.autocomplete = "off";
    input.value = values[f.key] || "";
    input.placeholder = f.sample ? "Например: " + f.sample : "";
    if (f.kind === "combo" && (f.options || []).length) {
      const list = el("datalist");
      list.id = id + "-list";
      list.innerHTML = f.options.map(o => "<option value='" + esc(o) + "'>").join("");
      wrap.appendChild(list);
      input.setAttribute("list", list.id);
    }
    input.addEventListener("input", () => set(f.key, input.value));
    wrap.appendChild(input);
    if (f.hint && f.hint !== f.key) {
      wrap.appendChild(help(f.hint));
    }
    return wrap;
  }

  function noteField(f, id) {
    const wrap = fieldBox(f, id);
    const t = el("textarea", "input");
    t.id = id;
    t.rows = 3;
    t.value = values[f.key] || "";
    t.placeholder = f.sample ? "Например: " + f.sample : "";
    t.addEventListener("input", () => {
      grow(t);
      set(f.key, t.value);
    });
    wrap.appendChild(t);
    if (f.hint && f.hint !== f.key) {
      wrap.appendChild(help(f.hint));
    }
    return wrap;
  }

  // one or more links: a line each, «Ещё …»
  function linksField(f, id) {
    const wrap = fieldBox(f, id);
    let items = String(values[f.key] || "").split(/\s*\n\s*/).filter(Boolean);
    if (!items.length) {
      items = [""];
    }
    const lines = el("div", "fields");
    lines.style.gap = "8px";
    wrap.appendChild(lines);
    const sync = () => set(f.key, items.map(s => s.trim()).filter(Boolean).join("\n"));
    const draw = focusLast => {
      lines.innerHTML = "";
      items.forEach((v, i) => {
        const row = el("div", "inrow", svg(ICON.merge, 18));
        const input = el("input");
        if (i === 0) {
          input.id = id;
        }
        input.inputMode = "url";
        input.autocomplete = "off";
        input.autocapitalize = "off";
        input.value = v;
        input.placeholder = i ? "Ещё ссылка" : (f.sample ? "Например: " + f.sample : "");
        input.setAttribute("aria-label", f.key + " " + (i + 1));
        input.addEventListener("input", () => {
          items[i] = input.value;
          sync();
        });
        row.appendChild(input);
        if (items.length > 1) {
          const x = el("button", "x", svg(ICON.x, 14, 2.4));
          x.type = "button";
          x.setAttribute("aria-label", "Убрать ссылку");
          x.addEventListener("click", () => {
            items.splice(i, 1);
            sync();
            draw(false);
          });
          row.appendChild(x);
        }
        lines.appendChild(row);
        if (focusLast && i === items.length - 1) {
          setTimeout(() => input.focus(), 0);
        }
      });
    };
    draw(false);
    const add = el("button", "add", svg(ICON.plus, 18, 2.2) + (f.key === "MR" ? "Ещё MR" : "Ещё ссылка"));
    add.type = "button";
    add.addEventListener("click", () => {
      items.push("");
      draw(true);
    });
    wrap.appendChild(add);
    return wrap;
  }

  // one of a few: a segmented control
  function choiceField(f) {
    const current = (f.options || []).find(o => o.toLowerCase() === String(values[f.key] || "").trim().toLowerCase());
    if (values[f.key] && !current) {
      // a value outside the choices (an older request): kept as typed
      return textField(f, "f-" + f.options.join(""));
    }
    const wrap = fieldBox(f, null);
    const seg = el("div", "seg");
    seg.setAttribute("role", "group");
    seg.setAttribute("aria-label", f.key);
    (f.options || []).forEach(o => {
      const b = el("button", null, esc(o));
      b.type = "button";
      b.setAttribute("aria-pressed", String(o === current));
      b.addEventListener("click", () => {
        const on = values[f.key] === o ? "" : o;
        set(f.key, on);
        seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.textContent === on)));
        haptic();
      });
      seg.appendChild(b);
    });
    wrap.appendChild(seg);
    if (f.hint) {
      wrap.appendChild(help(f.hint));
    }
    return wrap;
  }

  // several of a few: toggle chips
  function multiField(f) {
    const wrap = fieldBox(f, null);
    const picked = new Set(String(values[f.key] || "").split(/[,;\s]+/).map(x => x.toLowerCase()).filter(Boolean));
    const chips = el("div", "chips");
    (f.options || []).forEach(o => {
      const b = el("button", "chip", esc(o));
      b.type = "button";
      b.setAttribute("aria-pressed", String(picked.has(o.toLowerCase())));
      b.addEventListener("click", () => {
        b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed") !== "true"));
        set(f.key, [...chips.querySelectorAll("[aria-pressed=true]")].map(x => x.textContent).join(", "));
        haptic();
      });
      chips.appendChild(b);
    });
    wrap.appendChild(chips);
    return wrap;
  }

  // a date or a time: the phone's own picker
  function whenField(f, id) {
    const v = values[f.key] || "";
    const fits = f.kind === "date" ? /^\d{4}-\d{2}-\d{2}$/ : /^\d{2}:\d{2}$/;
    if (v && !fits.test(v)) {
      return textField(f, id);
    }
    const wrap = fieldBox(f, id);
    const input = el("input", "input");
    input.id = id;
    input.type = f.kind;
    input.value = v;
    input.addEventListener("input", () => set(f.key, input.value));
    wrap.appendChild(input);
    return wrap;
  }

  // ---------------------------------------------------------------- step 4: files and env

  // «🗄 Изменения БД — Liquibase changelog, SQL» describes the field of that name: only what follows the name
  function hintOf(f) {
    const parts = (f.hint || "").split(" — ");
    return parts.length > 1 && parts[0].includes(f.key) ? parts.slice(1).join(" — ") : "";
  }

  function isOn(f) {
    if (f.kind === "files") {
      return true;
    }
    return toggles[f.key] !== undefined ? toggles[f.key] : filled(f);
  }

  function renderFiles(box) {
    const cards = el("div", "cards");
    fieldsOf("files").forEach(f => cards.appendChild(fileCard(f)));
    box.appendChild(cards);
  }

  function fileCard(f) {
    const category = FILES[f.kind];
    const card = el("section", "fcard");
    card.dataset.key = f.key;
    const icon = f.kind === "db" ? ICON.db : f.kind === "env" ? ICON.env : ICON.clip;
    const color = f.kind === "db" ? COLOR.DEPLOY : f.kind === "env" ? COLOR.INFRA : COLOR.OTHER;
    const sub = hintOf(f) || (f.kind === "env" ? "KEY = значение или env-файл" : "");
    const head = el("div", "fhead", "<span class='ico sm' style='--c:" + color + "'>" + svg(icon, 20) + "</span>"
      + "<span class='tx'><span class='tt'>" + esc(f.key) + "</span>" + (sub ? "<span class='ts'>" + esc(sub) + "</span>" : "") + "</span>");
    card.appendChild(head);
    const body = el("div");
    const picker = el("input");
    picker.type = "file";
    picker.multiple = true;
    picker.hidden = true;
    picker.addEventListener("change", () => {
      Array.from(picker.files || []).forEach(file => files[category].push(file));
      picker.value = "";
      haptic();
      render();
    });
    card.appendChild(picker);
    if (f.kind === "files") {
      const attach = el("button", "pill", "Приложить");
      attach.type = "button";
      attach.addEventListener("click", () => picker.click());
      head.appendChild(attach);
      files[category].forEach((file, i) => body.appendChild(fileRow(category, file, i)));
      card.appendChild(body);
      return card;
    }
    const on = isOn(f);
    const sw = el("button", "switch");
    sw.type = "button";
    sw.setAttribute("role", "switch");
    sw.setAttribute("aria-checked", String(on));
    sw.setAttribute("aria-label", f.key);
    sw.addEventListener("click", () => {
      toggles[f.key] = !isOn(f);
      haptic();
      saveDraft();
      render();
    });
    head.appendChild(sw);
    if (!on) {
      return card;
    }
    if (f.kind === "db") {
      const text = el("div", "fbody");
      const t = el("textarea", "input");
      t.rows = 2;
      t.value = values[f.key] || "";
      t.placeholder = "Ссылка на MR или SQL текстом — или файлы ниже";
      t.setAttribute("aria-label", f.key + " текстом");
      t.style.minHeight = "50px";
      t.addEventListener("input", () => {
        t.style.height = "auto";
        t.style.height = (t.scrollHeight + 3) + "px";
        set(f.key, t.value);
      });
      text.appendChild(t);
      body.appendChild(text);
    } else {
      body.appendChild(envEditor(f));
    }
    files[category].forEach((file, i) => body.appendChild(fileRow(category, file, i)));
    const attach = el("button", "fbtn", svg(ICON.clip, 18, 1.9) + (f.kind === "env" ? "Приложить env-файл" : "Приложить файл"));
    attach.type = "button";
    attach.addEventListener("click", () => picker.click());
    body.appendChild(attach);
    card.appendChild(body);
    return card;
  }

  function size(bytes) {
    return bytes < 1024 ? bytes + " Б" : bytes < 1048576 ? Math.round(bytes / 1024) + " КБ" : (bytes / 1048576).toFixed(1) + " МБ";
  }

  function fileRow(category, file, i) {
    const row = el("div", "frow", "<span class='nm'>" + esc(file.name) + "</span><span class='sz'>" + size(file.size) + "</span>");
    const x = el("button", "x", svg(ICON.x, 13, 2.4));
    x.type = "button";
    x.setAttribute("aria-label", "Убрать " + file.name);
    x.addEventListener("click", () => {
      files[category].splice(i, 1);
      render();
    });
    row.appendChild(x);
    return row;
  }

  // KEY = value rows; a secret-looking key goes as *** (its value is passed through Vault); lines that are no variable are kept
  function envEditor(f) {
    const box = el("div", "fbody");
    const all = String(values[f.key] || "").split(/\n/).map(s => s.trim()).filter(Boolean);
    const isVar = s => /^[^=\s]+\s*=/.test(s);
    const rows = all.filter(isVar).map(s => ({k: s.split("=")[0].trim(), v: s.substring(s.indexOf("=") + 1).trim()}));
    const extra = all.filter(s => !isVar(s));
    if (!rows.length) {
      rows.push({k: "", v: ""});
    }
    const sync = () => set(f.key, rows.filter(r => r.k.trim())
      .map(r => r.k.trim() + "=" + (SECRET.test(r.k) ? "***" : r.v.trim())).concat(extra).join("\n"));
    const list = el("div", "fields");
    list.style.gap = "8px";
    const draw = focusLast => {
      list.innerHTML = "";
      rows.forEach((r, i) => {
        const line = el("div", "kv");
        const k = el("input");
        k.placeholder = "KEY";
        k.value = r.k;
        k.autocapitalize = "characters";
        k.autocomplete = "off";
        k.spellcheck = false;
        k.setAttribute("aria-label", "Переменная " + (i + 1));
        line.appendChild(k);
        const value = () => {
          if (SECRET.test(r.k)) {
            return el("div", "secret", svg(ICON.lock, 14, 2) + "*** через Vault");
          }
          const v = el("input");
          v.placeholder = "значение";
          v.value = r.v;
          v.autocapitalize = "off";
          v.autocomplete = "off";
          v.spellcheck = false;
          v.setAttribute("aria-label", "Значение " + (i + 1));
          v.addEventListener("input", () => {
            r.v = v.value;
            sync();
          });
          return v;
        };
        let cell = value();
        line.appendChild(cell);
        k.addEventListener("input", () => {
          const was = SECRET.test(r.k);
          r.k = k.value;
          if (was !== SECRET.test(r.k)) {
            const fresh = value();
            line.replaceChild(fresh, cell);
            cell = fresh;
          }
          sync();
        });
        const x = el("button", "x", svg(ICON.x, 13, 2.4));
        x.type = "button";
        x.setAttribute("aria-label", "Убрать переменную");
        x.addEventListener("click", () => {
          rows.splice(i, 1);
          if (!rows.length) {
            rows.push({k: "", v: ""});
          }
          sync();
          draw(false);
        });
        line.appendChild(x);
        list.appendChild(line);
        if (focusLast && i === rows.length - 1) {
          setTimeout(() => k.focus(), 0);
        }
      });
    };
    draw(false);
    box.appendChild(list);
    const add = el("button", "add", svg(ICON.plus, 18, 2.2) + "Переменная");
    add.type = "button";
    add.addEventListener("click", () => {
      rows.push({k: "", v: ""});
      draw(true);
    });
    box.appendChild(add);
    return box;
  }

  // ---------------------------------------------------------------- step 5: review

  function renderReview(box) {
    const stack = el("div", "stack");
    // the type and where it goes
    const top = el("section", "rcard");
    const whereMissing = fieldsOf("where").filter(f => f.required && !filled(f)).map(f => f.key);
    top.appendChild(el("div", "trow", "<span class='ico sm' style='--c:" + (COLOR[type.code] || COLOR.OTHER) + "'>" + svg(ICON[type.code] || ICON.OTHER, 20) + "</span>"
      + "<span class='tx'><span class='tt'>" + esc(type.title) + "</span><span class='ts'"
      + (whereMissing.length ? " style='color:var(--danger)'>Не указано: " + esc(whereMissing.join(", ")) : ">" + esc(context() || "без проекта")) + "</span></span>"));
    const editTop = editButton(steps.includes("where") ? "where" : "type");
    if (editTop) {
      top.querySelector(".trow").appendChild(editTop);
    }
    stack.appendChild(top);
    if (steps.includes("details")) {
      const card = el("section", "rcard");
      card.appendChild(sectionHead("Детали", "details"));
      const dl = el("dl", "sum");
      fieldsOf("details").forEach(f => {
        const v = (values[f.key] || "").trim();
        if (v) {
          dl.appendChild(el("dt", null, esc(f.key)));
          dl.appendChild(el("dd", null, esc(v)));
        } else if (f.required) {
          dl.appendChild(el("dt", null, esc(f.key)));
          dl.appendChild(el("dd", "miss", "Не заполнено"));
        }
      });
      if (!dl.children.length) {
        dl.appendChild(el("dd", "miss", "Ничего не заполнено"));
      }
      card.appendChild(dl);
      stack.appendChild(card);
    }
    if (steps.includes("files")) {
      const card = el("section", "rcard");
      card.appendChild(sectionHead("Файлы и env", "files"));
      const dl = el("dl", "sum");
      fieldsOf("files").filter(isOn).forEach(f => {
        const parts = [];
        const names = files[FILES[f.kind]].map(x => x.name);
        if (f.kind === "env") {
          const keys = String(values[f.key] || "").split("\n").filter(s => /=/.test(s)).map(s => s.split("=")[0].trim() + (SECRET.test(s.split("=")[0]) ? " (скрыт)" : ""));
          if (keys.length) {
            parts.push(keys.join(", "));
          }
        } else if ((values[f.key] || "").trim()) {
          parts.push(f.kind === "db" ? "текстом: " + values[f.key].trim() : values[f.key].trim());
        }
        if (names.length) {
          parts.push(names.join(", "));
        }
        if (parts.length) {
          dl.appendChild(el("dt", null, esc(f.key)));
          dl.appendChild(el("dd", null, esc(parts.join("\n"))));
        }
      });
      if (!dl.children.length) {
        dl.appendChild(el("dd", null, "Без файлов и переменных"));
        dl.lastChild.style.gridColumn = "1 / -1";
        dl.lastChild.style.fontWeight = "500";
        dl.lastChild.style.color = "var(--hint)";
      }
      card.appendChild(dl);
      stack.appendChild(card);
    }
    if ((type.confirmations || []).length) {
      const card = el("section", "ccard", "<div class='ch'><h2>Перед отправкой</h2><p class='help'>Отметки увидят DevOps в карточке заявки.</p></div>");
      type.confirmations.forEach((text, i) => {
        const row = el("label", "check");
        const box = el("input");
        box.type = "checkbox";
        box.checked = confirmed.has(i);
        box.addEventListener("change", () => {
          box.checked ? confirmed.add(i) : confirmed.delete(i);
          haptic();
          saveDraft();
        });
        row.appendChild(box);
        row.appendChild(el("span", null, esc(text.charAt(0).toUpperCase() + text.slice(1))));
        card.appendChild(row);
      });
      stack.appendChild(card);
    }
    box.appendChild(stack);
  }

  function sectionHead(title, target) {
    const head = el("div", "rhead", "<h2>" + esc(title) + "</h2>");
    const edit = editButton(target);
    if (edit) {
      head.appendChild(edit);
    }
    return head;
  }

  function editButton(target) {
    if (!steps.includes(target)) {
      return null;
    }
    const b = el("button", "edit", "Изменить");
    b.type = "button";
    b.addEventListener("click", () => goTo(target));
    return b;
  }

  // ---------------------------------------------------------------- sending

  // a field switched off is not sent, nor its files
  function active(f) {
    return !(f.kind === "db" || f.kind === "env") || isOn(f);
  }

  function sentFiles() {
    const out = {DB: [], ENV: [], OTHER: []};
    type.fields.filter(f => FILES[f.kind] && active(f)).forEach(f => out[FILES[f.kind]] = files[FILES[f.kind]]);
    return out;
  }

  // The server's limits, checked here: a larger upload is cut off on the way and would fail with no explanation.
  function oversize() {
    const all = [].concat(...Object.values(sentFiles()));
    const mb = bytes => Math.floor(bytes / 1048576) + " МБ";
    const limits = form.limits;
    if (all.length > limits.files) {
      return "Не больше " + limits.files + " файлов за раз — остальные пришлите кнопкой «📎 Прикрепить файлы» в личке с ботом.";
    }
    const big = all.find(file => file.size > limits.fileBytes);
    if (big) {
      return "«" + big.name + "» больше " + mb(limits.fileBytes) + " — дайте на него ссылку в описании.";
    }
    // the form's own part rides in the same request
    if (all.reduce((sum, file) => sum + file.size, 0) > limits.totalBytes - 65536) {
      return "Файлы вместе больше " + mb(limits.totalBytes) + " — приложите часть, на остальное дайте ссылку.";
    }
    return null;
  }

  async function send() {
    if (!type || sending) {
      return;
    }
    const tooLarge = oversize();
    if (tooLarge) {
      fail(tooLarge);
      return;
    }
    const miss = type.fields.filter(f => f.required && active(f) && !filled(f)).map(f => f.key);
    if (miss.length && !(await ask("Не заполнено: " + miss.join(", ") + ". Отправить всё равно?"))) {
      return;
    }
    sending = true;
    $("error").hidden = true;
    if (tg && tg.MainButton) {
      tg.MainButton.showProgress(false);
    }
    const data = new FormData();
    const payload = {type: type.code, values: {}, confirmed: [...confirmed].sort((a, b) => a - b), fixOf};
    type.fields.filter(active).forEach(f => {
      if ((values[f.key] || "").trim()) {
        payload.values[f.key] = values[f.key];
      }
    });
    data.append("form", new Blob([JSON.stringify(payload)], {type: "application/json"}));
    const sent = sentFiles();
    Object.keys(sent).forEach(c => sent[c].forEach(file => data.append(c, file, file.name)));
    try {
      const res = await fetch("/miniapp/api/requests", {method: "POST", headers: {"X-Telegram-Init-Data": initData}, body: data});
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        fail(body.error || "Заявка не отправлена — попробуйте ещё раз.");
        return;
      }
      clearDraft();
      done(body, Object.values(sent).reduce((n, list) => n + list.length, 0));
    } catch (e) {
      fail("Сервер заявок недоступен — заявка не отправлена, попробуйте ещё раз.");
    } finally {
      sending = false;
      if (tg && tg.MainButton) {
        tg.MainButton.hideProgress();
      }
    }
  }

  function done(result, fileCount) {
    finished = true;
    ["back", "progress", "fix", "error", "head", "step", "fallbackSend"].forEach(id => $(id).hidden = true);
    updateButtons();
    haptic("success");
    const when = new Date().toLocaleString("ru-RU", {day: "numeric", month: "long", hour: "2-digit", minute: "2-digit"});
    const prod = type.code === "DEPLOY" || type.code === "HOTFIX";
    const nextSteps = type.code === "ANNOUNCE" ? ["Публикация в канале в назначенное время"]
      : ["DevOps примет заявку", prod ? "Выкатка на прод" : "Выполнение", prod ? "Проверка после выкатки" : "Готово — бот напишет в личку"];
    const box = $("done");
    box.innerHTML = "<div class='big'>" + svg(ICON.check, 38, 2.6) + "</div>"
      + "<h1>" + (fixOf ? "Исправление отправлено" : "Заявка отправлена") + "</h1>"
      + "<p class='sub' style='max-width:320px'>Новости по ней бот пришлёт в личку, вопросы — в комментариях к посту.</p>"
      + "<section class='receipt'><div class='rtop'><span style='display:grid;gap:2px'><span class='lbl'>Номер</span><span class='num'>" + esc(result.number) + "</span></span>"
      + "<span class='status'>" + svg(ICON.clock, 14, 2.2) + "Ждёт DevOps</span></div>"
      + "<dl class='rgrid'><div><dt class='lbl'>Тип</dt><dd>" + esc(type.title) + "</dd></div>"
      + "<div><dt class='lbl'>Отправлена</dt><dd>" + esc(when) + "</dd></div>"
      + (values[keyOf("project")] ? "<div><dt class='lbl'>Проект</dt><dd>" + esc(values[keyOf("project")]) + "</dd></div>" : "")
      + "<div><dt class='lbl'>Файлы</dt><dd>" + (fileCount ? fileCount + " у DevOps" : "нет") + "</dd></div></dl></section>"
      + (result.hidden && result.hidden.length ? "<p class='help'>Скрыто (***): " + esc(result.hidden.join(", ")) + " — значения передайте через Vault.</p>" : "")
      + (result.failedFiles && result.failedFiles.length ? "<div class='alert error'>Не переданы файлы: " + esc(result.failedFiles.join(", "))
        + " — пришлите их кнопкой «📎 Прикрепить файлы» в личке с ботом.</div>" : "")
      + "<section class='next'><h2>Что дальше</h2><ol>" + nextSteps.map((s, i) => "<li><span class='n'>" + (i + 1) + "</span>" + esc(s) + "</li>").join("") + "</ol></section>";
    const actions = el("div", "actions");
    if (result.postUrl) {
      const open = el("button", "btn", "Открыть пост в канале");
      open.type = "button";
      open.addEventListener("click", () => tg && tg.openTelegramLink ? tg.openTelegramLink(result.postUrl) : window.open(result.postUrl));
      actions.appendChild(open);
    }
    const again = el("button", "btn secondary", "Закрыть");
    again.type = "button";
    again.addEventListener("click", () => tg && tg.close ? tg.close() : window.close());
    actions.appendChild(again);
    box.appendChild(actions);
    box.hidden = false;
    window.scrollTo({top: 0});
  }

  if (tg && tg.MainButton) {
    tg.MainButton.onClick(next);
  }
  if (nativeBack) {
    tg.BackButton.onClick(back);
  }
  $("fallbackSend").addEventListener("click", next);
  $("back").addEventListener("click", back);
  load();
})();
</script>
</body>
</html>
